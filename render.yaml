services:
  - type: web
    name: atif-khan-portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/session
    envVars:
      - key: NODE_ENV
        value: production
      - key: OWNER_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: portfolio-files
      - key: MAX_UPLOAD_MB
        value: "100"
